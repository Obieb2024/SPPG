<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Pengisian Data SPPG</title>
    <!-- Google Font for Premium Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Form Header with Elegant Icon -->
        <div class="form-header">
            <div class="logo-box">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="header-icon">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="9" y1="3" x2="9" y2="21"></line>
                    <line x1="15" y1="3" x2="15" y2="21"></line>
                    <line x1="3" y1="9" x2="21" y2="9"></line>
                    <line x1="3" y1="15" x2="21" y2="15"></line>
                </svg>
            </div>
            <h2>Formulir Data SPPG</h2>
            <p>Portal Input data operasional & pemantauan berkala SPPG Subang</p>
        </div>

        <form id="sppgForm">
            <!-- Dropdown Kecamatan -->
            <div class="form-group">
                <label for="kecamatan">Kecamatan</label>
                <div class="select-wrapper">
                    <select id="kecamatan" name="kecamatan" required>
                        <option value="">-- Pilih Kecamatan --</option>
                    </select>
                </div>
            </div>

            <!-- Dropdown Kelurahan -->
            <div class="form-group">
                <label for="kelurahan">Kelurahan/Desa</label>
                <div class="select-wrapper">
                    <select id="kelurahan" name="kelurahan" disabled required>
                        <option value="">-- Pilih Kelurahan/Desa --</option>
                    </select>
                </div>
            </div>

            <!-- Dropdown Nama SPPG -->
            <div class="form-group">
                <label for="nama_sppg">Nama SPPG</label>
                <div class="select-wrapper">
                    <select id="nama_sppg" name="nama_sppg" disabled required>
                        <option value="">-- Pilih Nama SPPG --</option>
                    </select>
                </div>
            </div>

            <!-- Segmented Status Control -->
            <div class="form-group">
                <label>Status Operasional</label>
                <div class="status-segmented">
                    <div class="status-option">
                        <input type="radio" name="status" id="status_aman" value="TIDAK BERMASALAH" required>
                        <label for="status_aman" class="status-card status-card-aman">
                            <div class="status-icon-wrapper">
                                <svg class="status-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                                    <polyline points="22 4 12 14.01 9 11.01"></polyline>
                                </svg>
                            </div>
                            <div class="status-details">
                                <span class="status-title">Tidak Bermasalah</span>
                                <span class="status-desc">Berjalan aman & lancar</span>
                            </div>
                        </label>
                    </div>
                    <div class="status-option">
                        <input type="radio" name="status" id="status_masalah" value="BERMASALAH" required>
                        <label for="status_masalah" class="status-card status-card-masalah">
                            <div class="status-icon-wrapper">
                                <svg class="status-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                                    <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                                    <line x1="12" y1="9" x2="12" y2="13"></line>
                                    <line x1="12" y1="17" x2="12.01" y2="17"></line>
                                </svg>
                            </div>
                            <div class="status-details">
                                <span class="status-title">Bermasalah</span>
                                <span class="status-desc">Ditemukan kendala operasional</span>
                            </div>
                        </label>
                    </div>
                </div>
            </div>

            <!-- Dropdown Keterangan -->
            <div class="form-group">
                <label for="keterangan">Keterangan</label>
                <div class="select-wrapper">
                    <select id="keterangan" name="keterangan" required>
                        <option value="">-- Pilih Keterangan --</option>
                        <option value="Berjalan">Berjalan</option>
                        <option value="Gangguan Pencernaan">Gangguan Pencernaan</option>
                        <option value="Bermasalah IPAL">Bermasalah IPAL</option>
                        <option value="Bermasalah SLHS">Bermasalah SLHS</option>
                        <option value="Bermasalah IPAL dan SLHS">Bermasalah IPAL dan SLHS</option>
                        <option value="MIX (IPAL">MIX (IPAL,SLHS,dll)</option>
                        <option value="Masalah lainnya (Temuan Benda Asing">Masalah lainnya (Temuan Benda Asing)</option>
                        <option value="Konflik Pengelola SPPG">Konflik Pengelola SPPG</option>
                        <option value="Masalah Mitra">Masalah Mitra</option>
                    </select>
                </div>
            </div>

            <!-- Keterangan Tambahan -->
            <div class="form-group">
                <label for="keterangan_tambahan">Keterangan Tambahan</label>
                <textarea id="keterangan_tambahan" name="keterangan_tambahan" rows="3" placeholder="Ketik keterangan tambahan di sini..."></textarea>
            </div>

            <!-- Kategori A: Foto Dokumentasi Wajib -->
            <div class="form-group document-section">
                <div class="section-title-box">
                    <span class="section-badge badge-a">A</span>
                    <label class="section-title">Dokumentasi Wajib (Semua Status)</label>
                </div>
                
                <!-- Foto Depan -->
                <div class="file-upload-card">
                    <div class="file-upload-header">
                        <div class="file-upload-icon-box">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="upload-icon-svg">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                <polyline points="17 8 12 3 7 8"></polyline>
                                <line x1="12" y1="3" x2="12" y2="15"></line>
                            </svg>
                        </div>
                        <div class="file-upload-info">
                            <span class="file-upload-label">1. Foto Tampak Depan SPPG</span>
                            <span class="file-upload-hint">Format gambar (Maks. 1 berkas)</span>
                        </div>
                    </div>
                    <div class="file-upload-body">
                        <input type="file" id="foto_depan" name="foto_depan" accept="image/*" class="real-file-input">
                        <label for="foto_depan" class="custom-file-trigger">Pilih Berkas</label>
                    </div>
                    <div id="preview_foto_depan" class="preview-container"></div>
                </div>

                <!-- Foto Operasional -->
                <div class="file-upload-card">
                    <div class="file-upload-header">
                        <div class="file-upload-icon-box">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="upload-icon-svg">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                <polyline points="17 8 12 3 7 8"></polyline>
                                <line x1="12" y1="3" x2="12" y2="15"></line>
                            </svg>
                        </div>
                        <div class="file-upload-info">
                            <span class="file-upload-label">2. Foto Operasional SPPG</span>
                            <span class="file-upload-hint">Bisa memilih lebih dari 1 foto</span>
                        </div>
                    </div>
                    <div class="file-upload-body">
                        <input type="file" id="foto_operasional" name="foto_operasional" accept="image/*" multiple class="real-file-input">
                        <label for="foto_operasional" class="custom-file-trigger">Pilih Berkas</label>
                    </div>
                    <div id="preview_foto_operasional" class="preview-container"></div>
                </div>
            </div>

            <!-- Kategori B: Lampiran Bukti Pendukung khusus Bermasalah -->
            <div class="form-group document-section hidden" id="group_bukti_bermasalah">
                <div class="section-title-box">
                    <span class="section-badge badge-b">B</span>
                    <label class="section-title">Bukti Pendukung Permasalahan</label>
                </div>
                
                <div class="file-upload-card">
                    <div class="file-upload-header">
                        <div class="file-upload-icon-box">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="upload-icon-svg">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                <polyline points="17 8 12 3 7 8"></polyline>
                                <line x1="12" y1="3" x2="12" y2="15"></line>
                            </svg>
                        </div>
                        <div class="file-upload-info">
                            <span class="file-upload-label">Unggah Lampiran Pendukung</span>
                            <span class="file-upload-hint">Bisa memilih beberapa Foto atau PDF</span>
                        </div>
                    </div>
                    <div class="file-upload-body">
                        <input type="file" id="bukti_pendukung" name="bukti_pendukung" accept="image/*,application/pdf" multiple class="real-file-input">
                        <label for="bukti_pendukung" class="custom-file-trigger">Pilih Berkas</label>
                    </div>
                    <div id="preview_bukti_pendukung" class="preview-container"></div>
                </div>
            </div>
            
            <!-- Submit Button -->
            <button type="submit" class="btn-submit">Simpan Data</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
